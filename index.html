<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script>
        // 카카오톡 인앱 브라우저 감지 시 자동 탈출 스크립트
        var userAgent = navigator.userAgent.toLowerCase();
        if (userAgent.indexOf("kakaotalk") > -1) {
            var currentUrl = location.href;
            
            // 안드로이드 기기인 경우 크롬 브라우저로 강제 이동
            if (userAgent.indexOf('android') > -1) {
                location.href = 'intent://' + currentUrl.replace(/https?:\/\//i, '') + '#Intent;scheme=https;package=com.android.chrome;end';
            } 
            // 아이폰(iOS) 기기인 경우 사파리/기본 브라우저로 강제 이동
            else {
                location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(currentUrl);
            }
        }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>회식비 정산 계산기</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-active: #2563eb;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --border-color: #d1d5db;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 16px;
        }

        .app-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 24px;
            margin-top: 20px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
            color: var(--text-main);
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 36px 12px 12px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            text-align: right;
            outline: none;
            transition: border-color 0.2s;
            /* iOS 확대 방지를 위한 폰트 사이즈 고정 */
            -webkit-text-size-adjust: 100%;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
        }

        .input-wrapper .unit {
            position: absolute;
            right: 12px;
            color: var(--text-sub);
            font-size: 14px;
            pointer-events: none;
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row .input-group {
            flex: 1;
        }

        .result-card {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-top: 24px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .result-row:last-child {
            margin-bottom: 0;
            padding-top: 12px;
            border-top: 1px dashed var(--border-color);
        }

        .result-label {
            font-weight: 600;
            color: var(--text-main);
        }

        .result-value {
            font-weight: 700;
            font-size: 18px;
            color: var(--primary);
        }

        .btn-copy {
            display: block;
            width: 100%;
            background-color: var(--primary);
            color: white;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            padding: 14px;
            border: none;
            border-radius: 8px;
            margin-top: 20px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-copy:active {
            background-color: var(--primary-active);
        }

        /* 알림 메시지 (Toast) */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 12px;
            position: fixed;
            z-index: 1;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 15px;
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>🍻 회식비 정산 계산기</h1>

        <div class="input-group">
            <label>총 결제 금액 (영수증 총액)</label>
            <div class="input-wrapper">
                <input type="text" id="totalAmount" inputmode="numeric" placeholder="0" oninput="formatNumber(this); calculate();">
                <span class="unit">원</span>
            </div>
        </div>

        <div class="row">
            <div class="input-group">
                <label>총 참석 인원</label>
                <div class="input-wrapper">
                    <input type="text" id="totalPeople" inputmode="numeric" placeholder="0" oninput="formatNumber(this); calculate();">
                    <span class="unit">명</span>
                </div>
            </div>
            <div class="input-group">
                <label>찬조금 (지원받은 돈)</label>
                <div class="input-wrapper">
                    <input type="text" id="sponsorAmount" inputmode="numeric" placeholder="0" oninput="formatNumber(this); calculate();">
                    <span class="unit">원</span>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="input-group">
                <label>술값 (음주자만 계산할 금액)</label>
                <div class="input-wrapper">
                    <input type="text" id="alcoholAmount" inputmode="numeric" placeholder="0" oninput="formatNumber(this); calculate();">
                    <span class="unit">원</span>
                </div>
            </div>
            <div class="input-group">
                <label>음주 인원</label>
                <div class="input-wrapper">
                    <input type="text" id="drinkers" inputmode="numeric" placeholder="0" oninput="formatNumber(this); calculate();">
                    <span class="unit">명</span>
                </div>
            </div>
        </div>

        <div class="result-card">
            <div class="result-row">
                <span class="result-label">🍺 음주자 (1인)</span>
                <span class="result-value" id="drinkerResult">0원</span>
            </div>
            <div class="result-row">
                <span class="result-label">🍚 비음주자 (1인)</span>
                <span class="result-value" id="nonDrinkerResult" style="color: var(--text-main);">0원</span>
            </div>
        </div>

        <button class="btn-copy" onclick="copyToClipboard()">결과 복사하기</button>
    </div>

    <div id="toast">복사 완료! 채팅방에 붙여넣기 하세요.</div>

    <script>
        // 숫자에 콤마(,) 찍어주는 함수
        function formatNumber(input) {
            let value = input.value.replace(/,/g, ''); // 기존 콤마 제거
            value = value.replace(/[^0-9]/g, ''); // 숫자 이외의 문자 제거
            
            if (value === '') {
                input.value = '';
                return;
            }
            input.value = Number(value).toLocaleString('ko-KR');
        }

        // 입력창에서 순수 숫자만 가져오는 함수
        function getNumber(id) {
            let val = document.getElementById(id).value.replace(/,/g, '');
            return Number(val) || 0;
        }

        // 금액 계산 함수
        function calculate() {
            try {
                let totalAmount = getNumber('totalAmount');
                let totalPeople = getNumber('totalPeople');
                let sponsorAmount = getNumber('sponsorAmount');
                let alcoholAmount = getNumber('alcoholAmount');
                let drinkers = getNumber('drinkers');

                // 방어 코드: 음주 인원이 총 인원보다 많을 수 없음
                if (drinkers > totalPeople) {
                    drinkers = totalPeople;
                    document.getElementById('drinkers').value = drinkers.toLocaleString('ko-KR');
                }

                let drinkerPay = 0;
                let nonDrinkerPay = 0;

                // 인원이 1명 이상일 때만 계산
                if (totalPeople > 0) {
                    // 1. 순수 밥값 계산 (총액 - 찬조금 - 술값)
                    let foodAmount = totalAmount - sponsorAmount - alcoholAmount;
                    if (foodAmount < 0) foodAmount = 0; // 마이너스 방지

                    // 2. 1인당 밥값 (비음주자가 내야 할 돈)
                    let perPersonFood = foodAmount / totalPeople;
                    
                    // 3. 1인당 술값
                    let perPersonAlcohol = 0;
                    if (drinkers > 0 && alcoholAmount > 0) {
                        perPersonAlcohol = alcoholAmount / drinkers;
                    }

                    // 4. 정산금액 올림 처리 (1원 단위 절상으로 모자라지 않게)
                    drinkerPay = Math.ceil(perPersonFood + perPersonAlcohol);
                    nonDrinkerPay = Math.ceil(perPersonFood);
                }

                // 결과 화면 업데이트
                document.getElementById('drinkerResult').innerText = drinkerPay.toLocaleString('ko-KR') + '원';
                document.getElementById('nonDrinkerResult').innerText = nonDrinkerPay.toLocaleString('ko-KR') + '원';
                
            } catch (error) {
                console.error("계산 중 오류 발생:", error);
            }
        }

        // 토스트 알림 띄우기
        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = "show";
            setTimeout(function() { 
                toast.className = toast.className.replace("show", ""); 
            }, 3000);
        }

        // 결과 복사 함수 (모바일 호환성 강화)
        function copyToClipboard() {
            const totalAmount = document.getElementById('totalAmount').value || '0';
            const drinkerPay = document.getElementById('drinkerResult').innerText;
            const nonDrinkerPay = document.getElementById('nonDrinkerResult').innerText;
            
            const textToCopy = `[회식비 정산 내역]\n\n총 결제액: ${totalAmount}원\n\n🍺 음주자: ${drinkerPay}\n🍚 비음주자: ${nonDrinkerPay}\n\n송금처: [은행] [계좌번호] [이름]`;

            // 모바일 인앱 브라우저에서도 복사가 잘 되도록 textarea 트릭 사용
            const textarea = document.createElement('textarea');
            textarea.value = textToCopy;
            textarea.setAttribute('readonly', ''); // 가상 키보드 방지
            textarea.style.position = 'absolute';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            
            textarea.select();
            textarea.setSelectionRange(0, 99999); // iOS 대응

            try {
                document.execCommand('copy');
                showToast("복사 완료! 채팅방에 붙여넣기 하세요.");
            } catch (err) {
                showToast("복사에 실패했습니다. 직접 복사해주세요.");
            }
            
            document.body.removeChild(textarea);
        }

        // 초기 실행: 처음 켰을 때 0원 세팅 (호환성 강화)
        document.addEventListener("DOMContentLoaded", function() {
            calculate();
        });
        
        // 모바일 환경에서 DOM 로드가 이미 끝난 상태일 경우 즉시 실행
        if (document.readyState === "complete" || document.readyState === "interactive") {
            setTimeout(calculate, 100);
        }
    </script>
</body>
</html>
